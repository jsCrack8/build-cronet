name: Build Latest Chromium Cronet Linux x64

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

env:
  DEPOT_TOOLS: /home/runner/depot_tools
  CHROMIUM_ROOT: /home/runner/chromium
  CHROMIUM_SRC: /home/runner/chromium/src
  OUT_DIR: /home/runner/chromium/src/out/Cronet
  GIT_TERMINAL_PROMPT: '0'
  DEPOT_TOOLS_UPDATE: '1'

jobs:
  linux-x64:
    name: Linux x64 Cronet
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Show runner information
        shell: bash
        run: |
          set -euxo pipefail
          echo "=== OS ==="
          command -v uname
          uname -a
          cat /etc/os-release || true
          echo "=== CPU ==="
          command -v uname
          uname -m
          nproc
          echo "=== Memory ==="
          free -h
          echo "=== Disk ==="
          df -h /

      - name: Free unused runner disk space
        shell: bash
        run: |
          set -euxo pipefail

          sudo rm -rf \
            /usr/local/lib/android \
            /usr/local/.ghcup \
            /opt/ghc \
            /usr/share/dotnet \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/go \
            /opt/hostedtoolcache/Python \
            /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk \
            /opt/hostedtoolcache/node \
            /opt/hostedtoolcache/Ruby \
            /opt/az \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/aws-sam-cli \
            /usr/local/lib/heroku \
            /usr/local/share/vcpkg \
            2>/dev/null || true

          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/* /tmp/* || true
          docker system prune -af --volumes 2>/dev/null || true

          echo "=== Disk after cleanup ==="
          df -h /

      - name: Install host prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            file \
            git \
            git-lfs \
            lsb-release \
            ninja-build \
            pkg-config \
            python3 \
            rsync \
            unzip \
            zip

          git lfs install --skip-repo
          python3 --version
          git --version
          ninja --version

      - name: Install and bootstrap latest depot_tools
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$DEPOT_TOOLS"
          git clone --depth=1 \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            "$DEPOT_TOOLS"

          export PATH="$DEPOT_TOOLS:$PATH"
          echo "$DEPOT_TOOLS" >> "$GITHUB_PATH"

          cd /home/runner

          # First gclient invocation bootstraps depot_tools' managed Python.
          gclient --version

          test -f "$DEPOT_TOOLS/python3_bin_reldir.txt"

          command -v gclient
          command -v fetch
          command -v gn
          command -v autoninja

          gclient --version
          gn --version
          autoninja --version

      - name: Install Chromium official build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$DEPOT_TOOLS:$PATH"

          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          git clone --depth=1 \
            https://chromium.googlesource.com/chromium/src.git \
            "$tmpdir/chromium"

          cd "$tmpdir/chromium"

          sudo ./build/install-build-deps.sh \
            --no-prompt \
            --no-arm \
            --no-nacl \
            --no-chromeos-fonts

      - name: Checkout latest Chromium main without history
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$DEPOT_TOOLS:$PATH"

          rm -rf "$CHROMIUM_ROOT"
          mkdir -p "$CHROMIUM_ROOT"
          cd /home/runner

          fetch --nohooks --no-history chromium

          cd "$CHROMIUM_SRC"

          git rev-parse HEAD | tee /home/runner/chromium_revision.txt

          if [[ -f chrome/VERSION ]]; then
            cat chrome/VERSION | tee /home/runner/chromium_version.txt
          else
            git describe --tags --always | tee /home/runner/chromium_version.txt
          fi

          df -h /

      - name: Sync DEPS and run Chromium hooks
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$DEPOT_TOOLS:$PATH"
          cd "$CHROMIUM_SRC"

          gclient sync \
            --no-history \
            --force \
            --reset \
            -D

          gclient runhooks

          df -h /

      - name: Generate GN files for Linux x64 Cronet
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$DEPOT_TOOLS:$PATH"
          cd "$CHROMIUM_SRC"

          rm -rf "$OUT_DIR"

          gn gen "$OUT_DIR" --args='\
          target_cpu = "x64"\
          is_debug = false\
          is_component_build = false\
          is_official_build = true\
          symbol_level = 0\
          blink_symbol_level = 0\
          v8_symbol_level = 0\
          enable_nacl = false\
          dcheck_always_on = false\
          use_goma = false\
          '

          gn args "$OUT_DIR" --list > /home/runner/gn_args.txt
          gn desc "$OUT_DIR" //components/cronet:cronet > /home/runner/gn_cronet_desc.txt

      - name: Build Cronet shared library only
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$DEPOT_TOOLS:$PATH"
          cd "$CHROMIUM_SRC"

          autoninja -C "$OUT_DIR" //components/cronet:cronet

      - name: Collect and verify Cronet library
        shell: bash
        run: |
          set -euxo pipefail
          cd "$CHROMIUM_SRC"

          mkdir -p /home/runner/cronet-artifact

          found=""
          while IFS= read -r f; do
            found="$f"
            break
          done < <(find "$OUT_DIR" -type f \( -name 'libcronet.so' -o -name 'libcronet*.so' \) -print | sort)

          if [[ -z "$found" ]]; then
            echo "ERROR: Cronet .so was not produced."
            echo "Available shared libraries:"
            find "$OUT_DIR" -type f -name '*.so*' -print | head -200 || true
            exit 1
          fi

          cp -L "$found" /home/runner/cronet-artifact/libcronet.so

          echo "Source file: $found"
          file /home/runner/cronet-artifact/libcronet.so
          readelf -h /home/runner/cronet-artifact/libcronet.so

          file /home/runner/cronet-artifact/libcronet.so | grep -E 'ELF 64-bit.*x86-64' || {
            echo "ERROR: output is not Linux x86-64 ELF"
            exit 1
          }

          sha256sum /home/runner/cronet-artifact/libcronet.so > /home/runner/cronet-artifact/SHA256SUMS.txt

          cat > /home/runner/cronet-artifact/build-info.txt <<EOF
          Chromium revision: $(git -C "$CHROMIUM_SRC" rev-parse HEAD)
          Chromium version: $(tr '\n' ' ' < "$CHROMIUM_SRC/chrome/VERSION" 2>/dev/null || true)
          Runner: ubuntu-latest
          Architecture: x86_64
          GN target: //components/cronet:cronet
          Original library: $found
          EOF

      - name: Upload Cronet artifact
        uses: actions/upload-artifact@v4
        with:
          name: cronet-linux-x64-latest
          path: /home/runner/cronet-artifact
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: cronet-linux-x64-build-metadata
          path: |
            /home/runner/chromium_revision.txt
            /home/runner/chromium_version.txt
            /home/runner/gn_args.txt
            /home/runner/gn_cronet_desc.txt
          if-no-files-found: warn
          retention-days: 7
