name: Build desktop Cronet

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

jobs:
  linux:
    name: Linux x64 shared library
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      DEPOT_TOOLS_UPDATE: "0"
    steps:
      - name: Check out workflow repository
        uses: actions/checkout@v4

      - name: Fetch latest Chromium without Git history
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$RUNNER_TEMP/depot_tools"
          echo "$RUNNER_TEMP/depot_tools" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/depot_tools:$PATH"

          mkdir -p "$RUNNER_TEMP/chromium-work"
          cd "$RUNNER_TEMP/chromium-work"
          fetch --nohooks --no-history chromium
          cd src
          gclient sync --no-history -D

      - name: Install Linux build dependencies and run hooks
        shell: bash
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/chromium-work/src"
          sudo build/install-build-deps.sh --no-prompt --no-syms --no-android --no-nacl --no-arm --no-chromeos-fonts
          gclient runhooks

      - name: Add the desktop Cronet target
        shell: bash
        run: |
          set -euxo pipefail
          export CHROMIUM_SRC="$RUNNER_TEMP/chromium-work/src"
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["CHROMIUM_SRC"])
          request_file = root / "components/cronet/cronet_url_request.cc"
          text = request_file.read_text(encoding="utf-8")

          build_include = '#include "build/build_config.h"\n'
          anchor = '#include "components/cronet/cronet_url_request.h"\n'
          if text.count(build_include) != 1 or text.count(anchor) != 1:
              raise RuntimeError("Unexpected cronet_url_request.cc include layout")
          text = text.replace(build_include, "", 1)
          text = text.replace(anchor, anchor + build_include, 1)

          jni_includes = (
              '#include "base/android/jni_android.h"\n'
              '#include "base/android/jni_string.h"\n'
          )
          if text.count(jni_includes) != 1:
              raise RuntimeError("Cronet JNI include block changed upstream")
          text = text.replace(
              jni_includes,
              "#if BUILDFLAG(IS_ANDROID)\n"
              + jni_includes
              + "#endif  // BUILDFLAG(IS_ANDROID)\n",
              1,
          )

          jni_header = '#include "components/cronet/android/cronet_jni_headers/CronetPccAuditLogger_jni.h"\n'
          if text.count(jni_header) != 1:
              raise RuntimeError("Cronet JNI header changed upstream")
          text = text.replace(
              jni_header,
              "#if BUILDFLAG(IS_ANDROID)\n"
              + jni_header
              + "#endif  // BUILDFLAG(IS_ANDROID)\n",
              1,
          )

          call = re.compile(
              r"(?m)^  \{\n"
              r"    JNIEnv\* env = base::android::AttachCurrentThread\(\);\n"
              r"    cronet::Java_CronetPccAuditLogger_maybeWrite\(env,[\s\S]*?^  \}\n"
          )
          matches = list(call.finditer(text))
          if len(matches) != 2:
              raise RuntimeError(
                  f"Expected two Android audit logger calls, found {len(matches)}"
              )
          for match in reversed(matches):
              replacement = (
                  "#if BUILDFLAG(IS_ANDROID)\n"
                  + match.group(0)
                  + "#endif  // BUILDFLAG(IS_ANDROID)\n"
              )
              text = text[: match.start()] + replacement + text[match.end() :]
          request_file.write_text(text, encoding="utf-8")

          native = root / "components/cronet/native"
          native.mkdir(parents=True, exist_ok=True)
          (native / "cronet.h").write_text(
              """#ifndef COMPONENTS_CRONET_NATIVE_CRONET_H_
          #define COMPONENTS_CRONET_NATIVE_CRONET_H_

          #if defined(_WIN32)
          #if defined(CRONET_NATIVE_IMPLEMENTATION)
          #define CRONET_NATIVE_EXPORT __declspec(dllexport)
          #else
          #define CRONET_NATIVE_EXPORT __declspec(dllimport)
          #endif
          #elif defined(__GNUC__) || defined(__clang__)
          #define CRONET_NATIVE_EXPORT __attribute__((visibility(\"default\")))
          #else
          #define CRONET_NATIVE_EXPORT
          #endif

          #ifdef __cplusplus
          extern \"C\" {
          #endif

          CRONET_NATIVE_EXPORT int cronet_initialize();
          CRONET_NATIVE_EXPORT const char* cronet_build_target();

          #ifdef __cplusplus
          }
          #endif

          #endif  // COMPONENTS_CRONET_NATIVE_CRONET_H_
          """.lstrip(),
              encoding="utf-8",
          )
          (native / "cronet_native.cc").write_text(
              """#define CRONET_NATIVE_IMPLEMENTATION
          #include \"components/cronet/native/cronet.h\"

          #include \"components/cronet/cronet_global_state.h\"

          extern \"C\" {

          CRONET_NATIVE_EXPORT int cronet_initialize() {
            cronet::EnsureInitialized();
            return 0;
          }

          CRONET_NATIVE_EXPORT const char* cronet_build_target() {
            return \"chromium-cronet-desktop\";
          }

          }  // extern \"C\"
          """.lstrip(),
              encoding="utf-8",
          )
          (native / "BUILD.gn").write_text(
              """import(\"//build/config/BUILDCONFIG.gn\")

          # Desktop Cronet is not an upstream distribution target. This target
          # is injected by CI so only the Cronet core and its dependencies are
          # linked into a shared library.
          shared_library(\"cronet\") {
            sources = [
              \"cronet.h\",
              \"cronet_native.cc\",
              \"../cronet_context.cc\",
              \"../cronet_global_state_stubs.cc\",
              \"../cronet_prefs_manager.cc\",
              \"../cronet_proxy_delegate.cc\",
              \"../cronet_upload_data_stream.cc\",
              \"../cronet_url_request.cc\",
              \"../host_cache_persistence_manager.cc\",
              \"../metrics_util.cc\",
              \"../url_request_context_config.cc\",
            ]

            deps = [
              \"//base\",
              \"//components/cronet:request_context_config_proto\",
              \"//components/prefs\",
              \"//net\",
            ]

            public_deps = [ \"//components/metrics:library_support\" ]
          }
          """.lstrip(),
              encoding="utf-8",
          )
          PY

      - name: Build only the Cronet shared library
        shell: bash
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/chromium-work/src"
          gn gen out/Cronet --args='is_debug = false
          is_component_build = false
          is_official_build = false
          is_cronet_build = false
          symbol_level = 0
          blink_symbol_level = 0
          v8_symbol_level = 0
          target_cpu = "x64"
          use_lld = true'
          autoninja -C out/Cronet components/cronet/native:cronet

          mkdir -p "$GITHUB_WORKSPACE/artifacts/cronet-linux-x64"
          library="$(find out/Cronet -type f -name 'libcronet.so' -print -quit)"
          test -n "$library"
          cp "$library" "$GITHUB_WORKSPACE/artifacts/cronet-linux-x64/libcronet.so"
          test -s "$GITHUB_WORKSPACE/artifacts/cronet-linux-x64/libcronet.so"

      - name: Upload Linux Cronet
        uses: actions/upload-artifact@v4
        with:
          name: cronet-linux-x64
          path: ${{ github.workspace }}/artifacts/cronet-linux-x64/libcronet.so
          if-no-files-found: error

  windows:
    name: Windows x64 dynamic library
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      DEPOT_TOOLS_UPDATE: "0"
      DEPOT_TOOLS_WIN_TOOLCHAIN: "0"
    steps:
      - name: Check out workflow repository
        uses: actions/checkout@v4

      - name: Fetch latest Chromium without Git history
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$env:RUNNER_TEMP\depot_tools"
          "$env:RUNNER_TEMP\depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:Path = "$env:RUNNER_TEMP\depot_tools;$env:Path"

          $work = Join-Path $env:RUNNER_TEMP 'chromium-work'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Set-Location $work
          fetch --nohooks --no-history chromium
          Set-Location (Join-Path $work 'src')
          gclient sync --no-history -D

      - name: Run Chromium hooks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location (Join-Path $env:RUNNER_TEMP 'chromium-work\src')
          gclient runhooks

      - name: Add the desktop Cronet target
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CHROMIUM_SRC = Join-Path $env:RUNNER_TEMP 'chromium-work\src'
          @'
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["CHROMIUM_SRC"])
          request_file = root / "components/cronet/cronet_url_request.cc"
          text = request_file.read_text(encoding="utf-8")

          build_include = '#include "build/build_config.h"\n'
          anchor = '#include "components/cronet/cronet_url_request.h"\n'
          if text.count(build_include) != 1 or text.count(anchor) != 1:
              raise RuntimeError("Unexpected cronet_url_request.cc include layout")
          text = text.replace(build_include, "", 1)
          text = text.replace(anchor, anchor + build_include, 1)

          jni_includes = (
              '#include "base/android/jni_android.h"\n'
              '#include "base/android/jni_string.h"\n'
          )
          if text.count(jni_includes) != 1:
              raise RuntimeError("Cronet JNI include block changed upstream")
          text = text.replace(
              jni_includes,
              "#if BUILDFLAG(IS_ANDROID)\n"
              + jni_includes
              + "#endif  // BUILDFLAG(IS_ANDROID)\n",
              1,
          )

          jni_header = '#include "components/cronet/android/cronet_jni_headers/CronetPccAuditLogger_jni.h"\n'
          if text.count(jni_header) != 1:
              raise RuntimeError("Cronet JNI header changed upstream")
          text = text.replace(
              jni_header,
              "#if BUILDFLAG(IS_ANDROID)\n"
              + jni_header
              + "#endif  // BUILDFLAG(IS_ANDROID)\n",
              1,
          )

          call = re.compile(
              r"(?m)^  \{\n"
              r"    JNIEnv\* env = base::android::AttachCurrentThread\(\);\n"
              r"    cronet::Java_CronetPccAuditLogger_maybeWrite\(env,[\s\S]*?^  \}\n"
          )
          matches = list(call.finditer(text))
          if len(matches) != 2:
              raise RuntimeError(
                  f"Expected two Android audit logger calls, found {len(matches)}"
              )
          for match in reversed(matches):
              replacement = (
                  "#if BUILDFLAG(IS_ANDROID)\n"
                  + match.group(0)
                  + "#endif  // BUILDFLAG(IS_ANDROID)\n"
              )
              text = text[: match.start()] + replacement + text[match.end() :]
          request_file.write_text(text, encoding="utf-8")

          native = root / "components/cronet/native"
          native.mkdir(parents=True, exist_ok=True)
          (native / "cronet.h").write_text(
              """#ifndef COMPONENTS_CRONET_NATIVE_CRONET_H_
          #define COMPONENTS_CRONET_NATIVE_CRONET_H_

          #if defined(_WIN32)
          #if defined(CRONET_NATIVE_IMPLEMENTATION)
          #define CRONET_NATIVE_EXPORT __declspec(dllexport)
          #else
          #define CRONET_NATIVE_EXPORT __declspec(dllimport)
          #endif
          #elif defined(__GNUC__) || defined(__clang__)
          #define CRONET_NATIVE_EXPORT __attribute__((visibility(\"default\")))
          #else
          #define CRONET_NATIVE_EXPORT
          #endif

          #ifdef __cplusplus
          extern \"C\" {
          #endif

          CRONET_NATIVE_EXPORT int cronet_initialize();
          CRONET_NATIVE_EXPORT const char* cronet_build_target();

          #ifdef __cplusplus
          }
          #endif

          #endif  // COMPONENTS_CRONET_NATIVE_CRONET_H_
          """.lstrip(),
              encoding="utf-8",
          )
          (native / "cronet_native.cc").write_text(
              """#define CRONET_NATIVE_IMPLEMENTATION
          #include \"components/cronet/native/cronet.h\"

          #include \"components/cronet/cronet_global_state.h\"

          extern \"C\" {

          CRONET_NATIVE_EXPORT int cronet_initialize() {
            cronet::EnsureInitialized();
            return 0;
          }

          CRONET_NATIVE_EXPORT const char* cronet_build_target() {
            return \"chromium-cronet-desktop\";
          }

          }  // extern \"C\"
          """.lstrip(),
              encoding="utf-8",
          )
          (native / "BUILD.gn").write_text(
              """import(\"//build/config/BUILDCONFIG.gn\")

          # Desktop Cronet is not an upstream distribution target. This target
          # is injected by CI so only the Cronet core and its dependencies are
          # linked into a shared library.
          shared_library(\"cronet\") {
            sources = [
              \"cronet.h\",
              \"cronet_native.cc\",
              \"../cronet_context.cc\",
              \"../cronet_global_state_stubs.cc\",
              \"../cronet_prefs_manager.cc\",
              \"../cronet_proxy_delegate.cc\",
              \"../cronet_upload_data_stream.cc\",
              \"../cronet_url_request.cc\",
              \"../host_cache_persistence_manager.cc\",
              \"../metrics_util.cc\",
              \"../url_request_context_config.cc\",
            ]

            deps = [
              \"//base\",
              \"//components/cronet:request_context_config_proto\",
              \"//components/prefs\",
              \"//net\",
            ]

            public_deps = [ \"//components/metrics:library_support\" ]
          }
          """.lstrip(),
              encoding="utf-8",
          )
          '@ | python -

      - name: Build only the Cronet dynamic library
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:RUNNER_TEMP 'chromium-work\src'
          Set-Location $src
          $gnArgs = @'
          is_debug = false
          is_component_build = false
          is_official_build = false
          is_cronet_build = false
          symbol_level = 0
          blink_symbol_level = 0
          v8_symbol_level = 0
          target_cpu = "x64"
          use_lld = true
          '@
          gn gen out/Cronet "--args=$gnArgs"
          autoninja -C out/Cronet components/cronet/native:cronet

          $artifactDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts\cronet-windows-x64'
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          $dll = Get-ChildItem -LiteralPath (Join-Path $src 'out\Cronet') -Filter 'cronet.dll' -File -Recurse | Select-Object -First 1
          if ($null -eq $dll) {
            throw 'cronet.dll was not produced'
          }
          Copy-Item -LiteralPath $dll.FullName -Destination (Join-Path $artifactDir 'cronet.dll')
          if ((Get-Item -LiteralPath (Join-Path $artifactDir 'cronet.dll')).Length -le 0) {
            throw 'cronet.dll is empty'
          }

      - name: Upload Windows Cronet
        uses: actions/upload-artifact@v4
        with:
          name: cronet-windows-x64
          path: ${{ github.workspace }}/artifacts/cronet-windows-x64/cronet.dll
          if-no-files-found: error
