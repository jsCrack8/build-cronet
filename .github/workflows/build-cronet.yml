name: Build Cronet DLL & SO

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-cronet:
    name: Build Cronet on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: cronet-linux-x64
            lib_file: libcronet.so
          - os: windows-latest
            artifact_name: cronet-windows-x64
            lib_file: cronet.dll

    steps:
      # ──────────────────────────────────────────────
      # 1. 仅检出最新提交（不下载历史版本）
      # ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1          # 浅克隆，只取最新 1 个提交

      # ──────────────────────────────────────────────
      # 2. 安装 depot_tools（Chromium 官方构建工具链）
      # ──────────────────────────────────────────────
      - name: Install depot_tools (Linux)
        if: runner.os == 'Linux'
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      - name: Install depot_tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git $env:USERPROFILE\depot_tools
          echo "$env:USERPROFILE\depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # ──────────────────────────────────────────────
      # 3. 拉取 Chromium 源码（浅克隆，仅最新提交）
      # ──────────────────────────────────────────────
      - name: Fetch Chromium source (shallow, latest only)
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth 1 https://chromium.googlesource.com/chromium/src.git chromium-src
          cd chromium-src
          echo "Checked out Chromium commit:"
          git log --oneline -1

      # ──────────────────────────────────────────────
      # 4. 运行 gclient hooks 获取第三方依赖
      #    注意：这一步会下载必要的依赖（不含完整历史）
      # ──────────────────────────────────────────────
      - name: Run gclient sync (fetch dependencies)
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/chromium-src
          gclient sync --no-history -D 2>&1 | tail -50

      # ──────────────────────────────────────────────
      # 5. 使用 cr_cronet.py 生成构建配置
      #    只编译 Cronet，不编译完整 Chromium
      # ──────────────────────────────────────────────
      - name: Generate GN build files for Cronet
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/chromium-src
          ./components/cronet/tools/cr_cronet.py gn --release --x64

      # ──────────────────────────────────────────────
      # 6. 编译 cronet_package 目标
      # ──────────────────────────────────────────────
      - name: Build cronet_package target
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/chromium-src
          # cr_cronet.py 默认输出目录为 out/Release-x64
          autoninja -C out/Release-x64 cronet_package 2>&1 | tail -80

      # ──────────────────────────────────────────────
      # 7. 收集构建产物
      # ──────────────────────────────────────────────
      - name: Collect build artifacts (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p $GITHUB_WORKSPACE/artifacts
          # cronet_package 产物位于 out/Release-x64/cronet/
          find $GITHUB_WORKSPACE/chromium-src/out/Release-x64/cronet -type f \
            \( -name "*.so" -o -name "*.h" -o -name "*.hpp" -o -name "*.a" \) \
            -exec cp {} $GITHUB_WORKSPACE/artifacts/ \;
          echo "=== Artifacts ==="
          ls -la $GITHUB_WORKSPACE/artifacts/

      - name: Collect build artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:GITHUB_WORKSPACE\artifacts
          $cronetDir = "$env:GITHUB_WORKSPACE\chromium-src\out\Release-x64\cronet"
          Get-ChildItem -Path $cronetDir -Recurse -File | Where-Object {
            $_.Extension -in '.dll', '.lib', '.h', '.hpp'
          } | ForEach-Object {
            Copy-Item $_.FullName -Destination "$env:GITHUB_WORKSPACE\artifacts\"
          }
          Write-Host "=== Artifacts ==="
          Get-ChildItem $env:GITHUB_WORKSPACE\artifacts\

      # ──────────────────────────────────────────────
      # 8. 上传产物
      # ──────────────────────────────────────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: $GITHUB_WORKSPACE/artifacts/
          if-no-files-found: error
          retention-days: 30
