name: Build Cronet (Windows & Linux)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # ============================================================
  # Linux x64
  # ============================================================
  build-linux:
    name: Build Cronet - Linux x64
    runs-on: ubuntu-22.04

    steps:
      # ----------------------------------------------------------
      # Free disk space
      # ----------------------------------------------------------
      - name: Free Disk Space
        shell: bash
        run: |
          set -eux

          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/nonexistent}" || true

          df -h

      # ----------------------------------------------------------
      # Basic dependencies
      # ----------------------------------------------------------
      - name: Install Dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            python3 \
            python3-pip \
            build-essential \
            pkg-config \
            libglib2.0-dev \
            libnss3-dev \
            libdbus-1-dev \
            ca-certificates

      # ----------------------------------------------------------
      # depot_tools
      # ----------------------------------------------------------
      - name: Install depot_tools
        shell: bash
        run: |
          set -eux

          rm -rf "$HOME/depot_tools"

          git clone \
            --depth 1 \
            --filter=blob:none \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            "$HOME/depot_tools"

          echo "$HOME/depot_tools" >> "$GITHUB_PATH"

          export PATH="$HOME/depot_tools:$PATH"

          gclient --version

      # ----------------------------------------------------------
      # Latest Chromium
      #
      # --no-history:
      #   不下载 Git 历史
      #
      # --shallow:
      #   浅 checkout
      #
      # checkout_*:
      #   禁止不需要的平台依赖
      # ----------------------------------------------------------
      - name: Fetch Latest Chromium
        shell: bash
        run: |
          set -eux

          export PATH="$HOME/depot_tools:$PATH"

          rm -rf "$GITHUB_WORKSPACE/chromium"

          mkdir -p "$GITHUB_WORKSPACE/chromium"

          cd "$GITHUB_WORKSPACE/chromium"

          cat > .gclient <<'EOF'
          solutions = [
            {
              "name": "src",
              "url": "https://chromium.googlesource.com/chromium/src.git",
              "deps_file": "DEPS",
              "managed": False,
              "custom_deps": {},
              "custom_vars": {
                "checkout_android": False,
                "checkout_android_prebuilts": False,
                "checkout_android_native_support": False,
                "checkout_ios": False,
                "checkout_mac": False,
                "checkout_win": False,
                "checkout_linux": True,
              },
            },
          ]
          EOF

          gclient sync \
            --no-history \
            --shallow \
            --nohooks \
            -j 8

      # ----------------------------------------------------------
      # Chromium build dependencies
      # ----------------------------------------------------------
      - name: Install Chromium Build Dependencies
        shell: bash
        run: |
          set -eux

          export PATH="$HOME/depot_tools:$PATH"

          cd "$GITHUB_WORKSPACE/chromium/src"

          ./build/install-build-deps.sh \
            --no-prompt \
            --no-chromeos-fonts \
            --no-android

      # ----------------------------------------------------------
      # Hooks
      # ----------------------------------------------------------
      - name: Run Chromium Hooks
        shell: bash
        run: |
          set -eux

          export PATH="$HOME/depot_tools:$PATH"

          cd "$GITHUB_WORKSPACE/chromium/src"

          gclient runhooks

      # ----------------------------------------------------------
      # Patch Cronet BUILD.gn for desktop
      #
      # Current Chromium main has Android-specific dependencies
      # inside components/cronet/BUILD.gn.
      #
      # We convert them to Android-only and restore a desktop
      # shared library target.
      # ----------------------------------------------------------
      - name: Patch Cronet BUILD
        shell: python3
        run: |
          from pathlib import Path

          path = Path(
              "chromium/src/components/cronet/BUILD.gn"
          )

          text = path.read_text(encoding="utf-8")

          # ------------------------------------------------------
          # 1. Android rules import:
          #
          # Current main:
          #
          # import("//build/config/android/rules.gni")
          #
          # This cannot be loaded on Linux/Windows.
          # ------------------------------------------------------
          old = 'import("//build/config/android/rules.gni")'

          if old in text:
              text = text.replace(
                  old,
                  'if (is_android) {\n'
                  '  import("//build/config/android/rules.gni")\n'
                  '}'
              )

          # ------------------------------------------------------
          # 2. request_context_config_java_proto
          #
          # Java proto target is Android-only.
          # ------------------------------------------------------
          old_block = '''proto_java_library("request_context_config_java_proto") {
  proto_path = "."
  sources = [ "proto/request_context_config.proto" ]
}
'''

          if old_block in text:
              text = text.replace(
                  old_block,
                  '''if (is_android) {
  proto_java_library("request_context_config_java_proto") {
    proto_path = "."
    sources = [ "proto/request_context_config.proto" ]
  }
}
'''
              )

          # ------------------------------------------------------
          # 3. Remove Android JNI dependency from desktop build.
          #
          # Existing:
          #
          # "//components/cronet/android:cronet_jni_headers",
          #
          # Replace with conditional deps.
          # ------------------------------------------------------
          old_dep = (
              '    "//components/cronet/android:cronet_jni_headers",\n'
          )

          if old_dep in text:
              text = text.replace(old_dep, "")

          # ------------------------------------------------------
          # 4. Append Android JNI dependency only on Android.
          # ------------------------------------------------------
          marker = '''public_deps = [ "//components/metrics:library_support" ]
'''

          if marker in text and (
              'cronet_common_android_deps' not in text
          ):
              replacement = '''if (is_android) {
  source_set("cronet_common_android_deps") {
    public_deps = [
      "//components/cronet/android:cronet_jni_headers",
    ]
  }
}

public_deps = [ "//components/metrics:library_support" ]
'''

              text = text.replace(
                  marker,
                  replacement,
                  1
              )

          # ------------------------------------------------------
          # 5. Restore desktop shared library.
          # ------------------------------------------------------
          if 'shared_library("cronet")' not in text:
              text += '''

# ==============================================================
# Desktop Cronet shared library
# ==============================================================
#
# Android and iOS use their own platform-specific packaging.
# Linux/Windows use this native shared library.
#
if (!is_android && !is_ios) {
  shared_library("cronet") {
    output_name = "cronet"

    deps = [
      "//base",
      "//build/config:exe_and_shlib_deps",
      "//components/cronet:cronet_common",
      "//components/cronet/native:cronet_native_impl",
      "//net",
    ]

    sources = [
      "cronet_global_state_stubs.cc",
    ]
  }
}
'''

          path.write_text(text, encoding="utf-8")

          print("===== Patched BUILD.gn =====")
          print(path.read_text(encoding="utf-8"))

      # ----------------------------------------------------------
      # GN
      # ----------------------------------------------------------
      - name: GN Generate
        shell: bash
        run: |
          set -eux

          export PATH="$HOME/depot_tools:$PATH"

          cd "$GITHUB_WORKSPACE/chromium/src"

          rm -rf out/Release

          mkdir -p out/Release

          cat > out/Release/args.gn <<'EOF'
          is_debug = false

          is_component_build = false

          target_cpu = "x64"

          symbol_level = 0
          blink_symbol_level = 0
          v8_symbol_level = 0

          use_custom_libcxx = true

          treat_warnings_as_errors = false

          is_official_build = false
          chrome_pgo_phase = 0

          root_extra_deps = [
            "//components/cronet:cronet",
          ]
          EOF

          gn gen out/Release

      # ----------------------------------------------------------
      # Build ONLY Cronet
      # ----------------------------------------------------------
      - name: Build Cronet
        shell: bash
        run: |
          set -eux

          export PATH="$HOME/depot_tools:$PATH"

          cd "$GITHUB_WORKSPACE/chromium/src"

          autoninja \
            -C out/Release \
            //components/cronet:cronet

      # ----------------------------------------------------------
      # Verify output
      # ----------------------------------------------------------
      - name: Verify Linux Cronet
        shell: bash
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/chromium/src"

          echo "===== Cronet output ====="

          find out/Release \
            -type f \
            \( \
              -name "libcronet*.so" \
              -o -name "cronet*.so" \
            \) \
            -print

          COUNT=$(find out/Release \
            -type f \
            \( \
              -name "libcronet*.so" \
              -o -name "cronet*.so" \
            \) \
            | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: Cronet .so not found."
            exit 1
          fi

      # ----------------------------------------------------------
      # Prepare artifact
      # ----------------------------------------------------------
      - name: Prepare Linux Artifact
        shell: bash
        run: |
          set -eux

          SRC="$GITHUB_WORKSPACE/chromium/src/out/Release"
          DST="$GITHUB_WORKSPACE/artifacts/linux"

          rm -rf "$GITHUB_WORKSPACE/artifacts"

          mkdir -p "$DST"

          find "$SRC" \
            -type f \
            \( \
              -name "libcronet*.so" \
              -o -name "cronet*.so" \
            \) \
            -exec cp {} "$DST/" \;

          ls -lah "$DST"

      # ----------------------------------------------------------
      # Upload
      # ----------------------------------------------------------
      - name: Upload Linux Cronet
        uses: actions/upload-artifact@v4
        with:
          name: cronet-linux-x64
          path: artifacts/linux
          if-no-files-found: error
          retention-days: 7


  # ============================================================
  # Windows x64
  # ============================================================
  build-windows:
    name: Build Cronet - Windows x64
    runs-on: windows-2022

    steps:
      # ----------------------------------------------------------
      # Git
      # ----------------------------------------------------------
      - name: Configure Git
        shell: powershell
        run: |
          git config --system core.longpaths true

      # ----------------------------------------------------------
      # depot_tools
      # ----------------------------------------------------------
      - name: Install depot_tools
        shell: cmd
        run: |
          if exist C:\depot_tools (
            rmdir /s /q C:\depot_tools
          )

          git clone ^
            --depth 1 ^
            --filter=blob:none ^
            https://chromium.googlesource.com/chromium/tools/depot_tools.git ^
            C:\depot_tools

          echo C:\depot_tools>>%GITHUB_PATH%

      # ----------------------------------------------------------
      # Use system Visual Studio
      # ----------------------------------------------------------
      - name: Configure Windows Toolchain
        shell: cmd
        run: |
          echo DEPOT_TOOLS_WIN_TOOLCHAIN=0>>%GITHUB_ENV%

      # ----------------------------------------------------------
      # Chromium
      # ----------------------------------------------------------
      - name: Fetch Latest Chromium
        shell: cmd
        run: |
          set PATH=C:\depot_tools;%PATH%

          if exist C:\chromium (
            rmdir /s /q C:\chromium
          )

          mkdir C:\chromium

          cd /d C:\chromium

          (
            echo solutions = [
            echo   {
            echo     "name": "src",
            echo     "url": "https://chromium.googlesource.com/chromium/src.git",
            echo     "deps_file": "DEPS",
            echo     "managed": False,
            echo     "custom_deps": {},
            echo     "custom_vars": {
            echo       "checkout_android": False,
            echo       "checkout_android_prebuilts": False,
            echo       "checkout_android_native_support": False,
            echo       "checkout_ios": False,
            echo       "checkout_mac": False,
            echo       "checkout_win": True,
            echo       "checkout_linux": False,
            echo     },
            echo   },
            echo ]
          ) > .gclient

          gclient sync ^
            --no-history ^
            --shallow ^
            --nohooks ^
            -j 8

      # ----------------------------------------------------------
      # Hooks
      # ----------------------------------------------------------
      - name: Run Chromium Hooks
        shell: cmd
        run: |
          set PATH=C:\depot_tools;%PATH%

          cd /d C:\chromium\src

          gclient runhooks

      # ----------------------------------------------------------
      # Patch Cronet BUILD.gn
      # ----------------------------------------------------------
      - name: Patch Cronet BUILD
        shell: python
        run: |
          from pathlib import Path

          path = Path(
              r"C:\chromium\src\components\cronet\BUILD.gn"
          )

          text = path.read_text(encoding="utf-8")

          # Android rules
          old = 'import("//build/config/android/rules.gni")'

          if old in text:
              text = text.replace(
                  old,
                  'if (is_android) {\n'
                  '  import("//build/config/android/rules.gni")\n'
                  '}'
              )

          # Android Java proto
          old_block = '''proto_java_library("request_context_config_java_proto") {
  proto_path = "."
  sources = [ "proto/request_context_config.proto" ]
}
'''

          if old_block in text:
              text = text.replace(
                  old_block,
                  '''if (is_android) {
  proto_java_library("request_context_config_java_proto") {
    proto_path = "."
    sources = [ "proto/request_context_config.proto" ]
  }
}
'''
              )

          # Android JNI dep
          old_dep = (
              '    "//components/cronet/android:cronet_jni_headers",\n'
          )

          if old_dep in text:
              text = text.replace(old_dep, "")

          # Desktop library
          if 'shared_library("cronet")' not in text:
              text += '''

# ==============================================================
# Desktop Cronet shared library
# ==============================================================

if (!is_android && !is_ios) {
  shared_library("cronet") {
    output_name = "cronet"

    deps = [
      "//base",
      "//build/config:exe_and_shlib_deps",
      "//components/cronet:cronet_common",
      "//components/cronet/native:cronet_native_impl",
      "//net",
    ]

    sources = [
      "cronet_global_state_stubs.cc",
    ]
  }
}
'''

          path.write_text(text, encoding="utf-8")

          print("===== Patched BUILD.gn =====")
          print(path.read_text(encoding="utf-8"))

      # ----------------------------------------------------------
      # GN
      # ----------------------------------------------------------
      - name: GN Generate
        shell: cmd
        run: |
          set PATH=C:\depot_tools;%PATH%

          cd /d C:\chromium\src

          if exist out\Release (
            rmdir /s /q out\Release
          )

          mkdir out\Release

          (
            echo is_debug = false
            echo is_component_build = false
            echo target_cpu = "x64"
            echo symbol_level = 0
            echo blink_symbol_level = 0
            echo v8_symbol_level = 0
            echo treat_warnings_as_errors = false
            echo is_official_build = false
            echo chrome_pgo_phase = 0
            echo root_extra_deps = [
            echo   "//components/cronet:cronet",
            echo ]
          ) > out\Release\args.gn

          gn gen out\Release

      # ----------------------------------------------------------
      # Build ONLY Cronet
      # ----------------------------------------------------------
      - name: Build Cronet
        shell: cmd
        run: |
          set PATH=C:\depot_tools;%PATH%

          cd /d C:\chromium\src

          autoninja ^
            -C out\Release ^
            //components/cronet:cronet

      # ----------------------------------------------------------
      # Verify
      # ----------------------------------------------------------
      - name: Verify Windows Cronet
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $root = "C:\chromium\src\out\Release"

          Write-Host "===== DLL ====="

          $dlls = Get-ChildItem `
            $root `
            -Recurse `
            -File `
            -Filter "cronet*.dll"

          if ($dlls.Count -eq 0) {
            throw "Cronet DLL not found."
          }

          $dlls |
            Select-Object FullName, Length |
            Format-Table -AutoSize

          Write-Host "===== LIB ====="

          $libs = Get-ChildItem `
            $root `
            -Recurse `
            -File `
            -Filter "cronet*.lib"

          $libs |
            Select-Object FullName, Length |
            Format-Table -AutoSize

      # ----------------------------------------------------------
      # Prepare artifact
      # ----------------------------------------------------------
      - name: Prepare Windows Artifact
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $root = "C:\chromium\src\out\Release"
          $dst = "$env:GITHUB_WORKSPACE\artifacts\windows"

          if (Test-Path $dst) {
            Remove-Item -Recurse -Force $dst
          }

          New-Item `
            -ItemType Directory `
            -Path $dst `
            -Force | Out-Null

          Get-ChildItem `
            $root `
            -Recurse `
            -File `
            -Filter "cronet*.dll" |
            ForEach-Object {
              Copy-Item $_.FullName $dst -Force
            }

          Get-ChildItem `
            $root `
            -Recurse `
            -File `
            -Filter "cronet*.lib" |
            ForEach-Object {
              Copy-Item $_.FullName $dst -Force
            }

          Write-Host "===== Final artifact ====="

          Get-ChildItem $dst |
            Select-Object Name, Length |
            Format-Table -AutoSize

      # ----------------------------------------------------------
      # Upload
      # ----------------------------------------------------------
      - name: Upload Windows Cronet
        uses: actions/upload-artifact@v4
        with:
          name: cronet-windows-x64
          path: artifacts/windows
          if-no-files-found: error
          retention-days: 7
