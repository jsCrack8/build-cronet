name: Build Latest Chromium Cronet Linux x64

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

env:
  DEPOT_TOOLS: /home/runner/depot_tools
  CHROMIUM_ROOT: /home/runner/chromium
  CHROMIUM_SRC: /home/runner/chromium/src
  OUT_DIR: /home/runner/chromium/src/out/Cronet
  PATH: /home/runner/depot_tools:${PATH}
  GIT_TERMINAL_PROMPT: '0'
  DEPOT_TOOLS_UPDATE: '1'

jobs:
  linux-x64:
    name: Linux x64 Cronet
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Show runner information
        shell: bash
        run: |
          set -euxo pipefail
          echo "=== OS ==="
          uname -a
          cat /etc/os-release || true
          echo "=== CPU ==="
          uname -m
          nproc
          echo "=== Memory ==="
          free -h
          echo "=== Disk ==="
          df -h /

      - name: Free unused runner disk space
        shell: bash
        run: |
          set -euxo pipefail

          # Remove large preinstalled SDK/tool directories which are not needed
          # for a Linux-only Chromium/Cronet build. Ignore paths that are absent.
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/local/.ghcup \
            /opt/ghc \
            /usr/share/dotnet \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/go \
            /opt/hostedtoolcache/Python \
            /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk \
            /opt/hostedtoolcache/node \
            /opt/hostedtoolcache/Ruby \
            /opt/az \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/aws-sam-cli \
            /usr/local/lib/heroku \
            /usr/local/share/vcpkg \
            2>/dev/null || true

          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/* /tmp/* || true
          docker system prune -af --volumes 2>/dev/null || true

          echo "=== Disk after cleanup ==="
          df -h /

      - name: Install host prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            file \
            git \
            git-lfs \
            lsb-release \
            ninja-build \
            pkg-config \
            python3 \
            rsync \
            unzip \
            zip

          git lfs install --skip-repo
          python3 --version
          git --version
          ninja --version

      - name: Install and bootstrap latest depot_tools
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$DEPOT_TOOLS"
          git clone --depth=1 \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            "$DEPOT_TOOLS"

          export PATH="$DEPOT_TOOLS:$PATH"

          echo "=== depot_tools files ==="
          test -x "$DEPOT_TOOLS/gclient"
          test -x "$DEPOT_TOOLS/fetch"
          ls -la "$DEPOT_TOOLS" | head -80

          # IMPORTANT: the first gclient invocation bootstraps depot_tools and
          # creates python3_bin_reldir.txt before fetch is used.
          cd /home/runner
          gclient --version

          echo "=== depot_tools bootstrap check ==="
          test -f "$DEPOT_TOOLS/python3_bin_reldir.txt" \
            || { echo "depot_tools bootstrap did not complete"; exit 1; }

          command -v gclient
          command -v fetch
          command -v gn
          command -v autoninja
          gclient --version
          gn --version
          autoninja --version

      - name: Install Chromium official build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          # Use Chromium's own dependency installer instead of maintaining a
          # manually curated package list. Do not request lib32 dependencies:
          # this workflow builds Linux x64 only.
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          git clone --depth=1 \
            https://chromium.googlesource.com/chromium/src.git \
            "$tmpdir/chromium"

          cd "$tmpdir/chromium"

          sudo ./build/install-build-deps.sh \
            --no-prompt \
            --no-arm \
            --no-nacl \
            --no-chromeos-fonts

      - name: Checkout latest Chromium main without history
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$DEPOT_TOOLS:$PATH"

          rm -rf "$CHROMIUM_ROOT"
          mkdir -p "$CHROMIUM_ROOT"
          cd /home/runner

          # No branch/tag/version is specified: fetch follows Chromium main.
          # --no-history avoids downloading the repository's historical Git data.
          fetch --nohooks --no-history chromium

          cd "$CHROMIUM_SRC"

          echo "=== Chromium revision ==="
          git rev-parse HEAD | tee /home/runner/chromium_revision.txt

          echo "=== Chromium version ==="
          if [[ -f chrome/VERSION ]]; then
            cat chrome/VERSION | tee /home/runner/chromium_version.txt
          else
            git describe --tags --always | tee /home/runner/chromium_version.txt
          fi

          echo "=== Disk after checkout ==="
          df -h /

      - name: Sync DEPS and run required Chromium hooks
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$DEPOT_TOOLS:$PATH"
          cd "$CHROMIUM_SRC"

          # Keep dependency repositories shallow where supported and avoid
          # retaining their historical Git objects.
          gclient sync \
            --no-history \
            --force \
            --reset \
            -D

          gclient runhooks

          echo "=== Disk after DEPS/hooks ==="
          df -h /

      - name: Generate GN files for Linux x64 Cronet
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$DEPOT_TOOLS:$PATH"
          cd "$CHROMIUM_SRC"

          rm -rf "$OUT_DIR"

          gn gen "$OUT_DIR" --args=''
            target_cpu = "x64"
            is_debug = false
            is_component_build = false
            symbol_level = 0
            blink_symbol_level = 0
            v8_symbol_level = 0
            enable_nacl = false
            use_goma = false
            dcheck_always_on = false
          ''

          echo "=== GN args ==="
          gn args "$OUT_DIR" --list > /home/runner/gn_args.txt

          echo "=== Cronet target description ==="
          gn desc "$OUT_DIR" //components/cronet:cronet > /home/runner/gn_cronet_desc.txt

      - name: Build Cronet shared library only
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$DEPOT_TOOLS:$PATH"
          cd "$CHROMIUM_SRC"

          # Build only the Linux native Cronet target; do not build Chrome.
          autoninja -C "$OUT_DIR" //components/cronet:cronet

      - name: Locate and verify Cronet x64 shared library
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p /home/runner/cronet-artifact

          echo "=== Candidate Cronet libraries ==="
          find "$OUT_DIR" -type f \( \
            -name 'libcronet*.so' -o \
            -name 'cronet*.so' \
          \) -print | sort

          found="$(find "$OUT_DIR" -type f \( \
            -name 'libcronet*.so' -o \
            -name 'cronet*.so' \
          \) -print -quit)"

          if [[ -z "$found" ]]; then
            echo "ERROR: No Cronet shared library was produced."
            echo "All generated shared libraries:"
            find "$OUT_DIR" -type f -name '*.so*' -print | sort | head -300 || true
            exit 1
          fi

          echo "Selected library: $found"
          cp -L "$found" /home/runner/cronet-artifact/libcronet.so

          echo "=== file ==="
          file /home/runner/cronet-artifact/libcronet.so

          echo "=== ELF header ==="
          readelf -h /home/runner/cronet-artifact/libcronet.so

          echo "=== Architecture check ==="
          file /home/runner/cronet-artifact/libcronet.so | grep -E 'ELF 64-bit.*x86-64'

          echo "=== SHA256 ==="
          sha256sum /home/runner/cronet-artifact/libcronet.so \
            | tee /home/runner/cronet-artifact/SHA256SUMS.txt

          chromium_revision="$(git -C "$CHROMIUM_SRC" rev-parse HEAD)"
          chromium_version="$(tr '\n' ' ' < "$CHROMIUM_SRC/chrome/VERSION" 2>/dev/null || true)"

          cat > /home/runner/cronet-artifact/build-info.txt <<EOF
          Chromium revision: ${chromium_revision}
          Chromium version: ${chromium_version}
          Runner: ubuntu-latest
          OS architecture: x86_64
          GN target: //components/cronet:cronet
          Output: libcronet.so
          Original file: ${found}
          EOF

      - name: Upload Cronet artifact
        uses: actions/upload-artifact@v4
        with:
          name: cronet-linux-x64-latest
          path: /home/runner/cronet-artifact
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: cronet-linux-x64-build-metadata
          path: |
            /home/runner/chromium_revision.txt
            /home/runner/chromium_version.txt
            /home/runner/gn_args.txt
            /home/runner/gn_cronet_desc.txt
          if-no-files-found: warn
          retention-days: 7
