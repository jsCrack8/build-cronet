name: Build Latest Chromium Cronet Windows x64

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64 Cronet
    runs-on: windows-2022
    timeout-minutes: 360

    env:
      DEPOT_TOOLS: C:\depot_tools
      CHROMIUM_ROOT: C:\chromium
      CHROMIUM_SRC: C:\chromium\src
      OUT_DIR: C:\chromium\src\out\Cronet
      GIT_TERMINAL_PROMPT: '0'
      DEPOT_TOOLS_UPDATE: '1'
      DEPOT_TOOLS_WIN_TOOLCHAIN: '0'
      GYP_MSVS_VERSION: '2022'

    steps:
      - name: Install depot_tools
        shell: pwsh
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git $env:DEPOT_TOOLS
          echo $env:DEPOT_TOOLS >> $env:GITHUB_PATH

      - name: Setup Visual Studio and SDK
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw "VS2022 not found" }

          cmd /c "`"$vs\Common7\Tools\VsDevCmd.bat`" -arch=x64 && set" > vsenv.txt

          Get-Content vsenv.txt | ForEach-Object {
            if ($_ -match "^(.*?)=(.*)$") {
              Set-Item "env:$($matches[1])" $matches[2]
            }
          }

          Remove-Item Env:INCLUDE -ErrorAction SilentlyContinue
          Remove-Item Env:LIB -ErrorAction SilentlyContinue

      - name: Checkout Chromium
        shell: cmd
        run: |
          set PATH=%DEPOT_TOOLS%;%PATH%
          mkdir C:\chromium
          cd /d C:\chromium
          call fetch.bat --nohooks --no-history chromium

      - name: Run hooks
        shell: cmd
        run: |
          set PATH=%DEPOT_TOOLS%;%PATH%
          cd /d %CHROMIUM_SRC%
          call gclient.bat runhooks

      - name: Generate GN args
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:OUT_DIR | Out-Null
          @'
target_cpu = "x64"
is_debug = false
is_component_build = false
symbol_level = 0
blink_symbol_level = 0
v8_symbol_level = 0
use_thin_lto = false
chrome_pgo_phase = 0
visual_studio_path = "C:/Program Files/Microsoft Visual Studio/2022/Enterprise"
win_sdk_version = "10.0.26100.0"
'@ | Out-File "$env:OUT_DIR\args.gn" -Encoding utf8

      - name: GN generate
        shell: cmd
        run: |
          set PATH=%DEPOT_TOOLS%;%PATH%
          cd /d %CHROMIUM_SRC%
          call gn.bat gen "%OUT_DIR%"
          call gn.bat desc "%OUT_DIR%" //components/cronet:cronet > C:\gn_cronet_desc.txt

      - name: Build Cronet
        shell: cmd
        run: |
          set PATH=%DEPOT_TOOLS%;%PATH%
          cd /d %CHROMIUM_SRC%
          call autoninja.bat -C "%OUT_DIR%" //components/cronet:cronet

      - name: Package
        shell: pwsh
        run: |
          $out="C:\cronet-artifact"
          New-Item "$out\bin" -Force -ItemType Directory | Out-Null
          Copy-Item "$env:OUT_DIR\cronet.dll" "$out\bin\"
          Copy-Item "$env:CHROMIUM_SRC\components\cronet\native\include\*.h" "$out\"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: cronet-windows-x64-latest
          path: C:\cronet-artifact
          compression-level: 0
          retention-days: 7
