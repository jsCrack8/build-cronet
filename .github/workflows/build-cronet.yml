on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-latest-cronet-linux-x64
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive
  DEPOT_TOOLS_UPDATE: '1'
  GCLIENT_SUPPRESS_GIT_MISSING_WARNING: '1'
  VPYTHON_BYPASS: '0'
  CHROMIUM_ROOT: /home/runner/chromium
  DEPOT_TOOLS: /home/runner/depot_tools
  OUT_DIR: /home/runner/chromium/src/out/Release-x64

jobs:
  build-cronet:
    name: Chromium Cronet Linux x64
    # Fixed large Ubuntu runner. Create a GitHub-hosted Larger Runner with
    # this exact name/label: ubuntu-24.04-16core
    runs-on: ubuntu-24.04-16core
    timeout-minutes: 1440

    defaults:
      run:
        shell: bash

    steps:
      - name: Show runner information
        run: |
          set -euxo pipefail
          echo '=== CPU ==='
          nproc
          lscpu | sed -n '1,35p' || true
          echo '=== RAM ==='
          free -h
          echo '=== OS ==='
          cat /etc/os-release
          echo '=== Kernel ==='
          uname -a
          echo '=== Disk ==='
          df -hT
          echo '=== Mounts ==='
          lsblk -o NAME,SIZE,TYPE,FSTYPE,MOUNTPOINTS || true

      - name: Verify x86_64 and required disk space
        run: |
          set -euo pipefail

          ARCH="$(uname -m)"
          if [ "${ARCH}" != "x86_64" ]; then
            echo "ERROR: Chromium Cronet Linux build requires x86_64/amd64. Detected: ${ARCH}"
            exit 1
          fi

          MIN_FREE_GB=110
          FREE_GB="$(df -Pk /home/runner | awk 'NR==2 {printf "%d", $4/1024/1024}')"
          echo "Free space on /home/runner: ${FREE_GB} GB"
          echo "Required free space: ${MIN_FREE_GB} GB"

          if [ "${FREE_GB}" -lt "${MIN_FREE_GB}" ]; then
            cat <<'EOF'
          ERROR: Not enough free disk space for a Chromium checkout/build.

          The current Chromium Linux build documentation requires at least
          100 GB free disk space, and a safety margin is used here.

          IMPORTANT:
            This workflow intentionally has no version or runner inputs.
          It targets the fixed latest-stable Ubuntu larger-runner label:
          ubuntu-24.04-16core.

          That runner should be configured as an x64 Ubuntu 24.04 larger runner
          with 16 cores, 64 GB RAM and 600 GB SSD.
          EOF
            exit 1
          fi

      - name: Remove unnecessary preinstalled software
        run: |
          set -euxo pipefail

          # This is only cleanup. Chromium dependencies themselves are
          # installed later by Chromium's official install-build-deps.sh.
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/local/.ghcup \
            /opt/hostedtoolcache \
            /usr/share/dotnet \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/share/boost \
            /usr/local/julia* \
            /usr/local/lib/node_modules || true

          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true

          echo '=== Disk after runner cleanup ==='
          df -hT

      - name: Install bootstrap packages
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            apt-transport-https \
            build-essential \
            ca-certificates \
            clang \
            curl \
            file \
            g++ \
            git \
            git-lfs \
            gnupg \
            libasound2-dev \
            libatk-bridge2.0-dev \
            libatk1.0-dev \
            libc6-dev \
            libcups2-dev \
            libdrm-dev \
            libgbm-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libnspr4-dev \
            libnss3-dev \
            libpango1.0-dev \
            libpulse-dev \
            libudev-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcomposite-dev \
            libxdamage-dev \
            libxext-dev \
            libxfixes-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            lsb-release \
            ninja-build \
            pkg-config \
            python3 \
            python3-dev \
            python3-venv \
            rsync \
            sudo \
            unzip \
            xz-utils \
            zip

          git lfs install --skip-repo || true

          echo '=== Tool versions ==='
          python3 --version
          git --version
          clang --version | head -n 2
          ninja --version

      - name: Configure kernel limits for Chromium
        run: |
          set -euxo pipefail

          # Chromium recommends a larger vm.max_map_count for large builds.
          sudo sysctl -w vm.max_map_count=262144

          # Make the current shell/session capable of opening many files.
          ulimit -n 1048576 || true

          echo '=== Kernel limits ==='
          sysctl vm.max_map_count
          ulimit -n

      - name: Clone latest depot_tools
        run: |
          set -euxo pipefail

          rm -rf "${DEPOT_TOOLS}"
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "${DEPOT_TOOLS}"
          echo "${DEPOT_TOOLS}" >> "${GITHUB_PATH}"
          export PATH="${DEPOT_TOOLS}:${PATH}"

          command -v fetch
          command -v gclient
          command -v gn
          command -v autoninja

      - name: Checkout latest Chromium main without Git history
        run: |
          set -euxo pipefail
          export PATH="${DEPOT_TOOLS}:${PATH}"

          rm -rf "${CHROMIUM_ROOT}"
          mkdir -p "${CHROMIUM_ROOT}"
          cd "${CHROMIUM_ROOT}"

          # Official Chromium checkout method. --no-history avoids downloading
          # historical Git objects that are not needed for this build.
          fetch --nohooks --no-history chromium

          cd src

          echo '=== Chromium revision ==='
          git rev-parse HEAD
          git log -1 --format='%H%n%ad%n%s' --date=iso-strict

          echo '=== Chromium version ==='
          cat chrome/VERSION

          echo '=== Disk after Chromium checkout ==='
          df -hT

      - name: Install Chromium build dependencies using official script
        working-directory: /home/runner/chromium/src
        run: |
          set -euxo pipefail

          # Let the exact Chromium revision decide its dependency set instead
          # of hard-coding a potentially stale package list.
          sudo ./build/install-build-deps.sh \
            --no-prompt \
            --no-arm \
            --no-nacl \
            --no-chromeos-fonts \
            --no-syms

          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true

      - name: Run Chromium hooks
        working-directory: /home/runner/chromium/src
        run: |
          set -euxo pipefail
          export PATH="${DEPOT_TOOLS}:${PATH}"

          gclient runhooks

          echo '=== Disk after hooks ==='
          df -hT

      - name: Generate GN files for Linux x64 Cronet
        working-directory: /home/runner/chromium/src
        run: |
          set -euxo pipefail
          export PATH="${DEPOT_TOOLS}:${PATH}"

          rm -rf "${OUT_DIR}"

          cat > "${OUT_DIR}.args" <<'GNARGS'
          is_debug = false
          is_component_build = false
          is_official_build = true
          target_cpu = "x64"

          # Smaller symbols reduce disk usage while leaving a normal release .so.
          symbol_level = 0
          blink_symbol_level = 0

          use_lld = true
          use_thin_lto = false
          dcheck_always_on = false
          fatal_linker_warnings = false

          enable_nacl = false
          enable_widevine = false
          proprietary_codecs = false
          ffmpeg_branding = "Chromium"
          GNARGS

          echo '=== GN args ==='
          cat "${OUT_DIR}.args"

          gn gen "${OUT_DIR}" --args="$(cat "${OUT_DIR}.args")"

          echo '=== GN args as resolved by GN ==='
          gn args "${OUT_DIR}" --list | sed -n '1,220p'

      - name: Build only the native Linux Cronet shared library
        working-directory: /home/runner/chromium/src
        run: |
          set -euxo pipefail
          export PATH="${DEPOT_TOOLS}:${PATH}"

          CPU_COUNT="$(nproc)"
          echo "Using ${CPU_COUNT} parallel jobs"

          # Current Chromium's //components/cronet BUILD.gn provides the
          # native desktop shared_library target for non-Android/non-iOS builds.
          # No Chrome browser target, APK, or Android Cronet build is requested.
          autoninja -C "${OUT_DIR}" -j "${CPU_COUNT}" //components/cronet:cronet

      - name: Find and validate generated Cronet .so
        working-directory: /home/runner/chromium/src
        run: |
          set -euxo pipefail

          echo '=== Generated Cronet shared libraries ==='
          find "${OUT_DIR}" -type f \
            \( -name 'libcronet*.so' -o -name 'cronet*.so' \) \
            -printf '%p %k KB\n' | sort

          CRONET_SO="$(find "${OUT_DIR}" -type f -name 'libcronet*.so' -print -quit)"
          if [ -z "${CRONET_SO}" ]; then
            echo 'ERROR: libcronet*.so was not found.'
            echo 'Check the full Ninja/GN log above for a target or source layout change.'
            exit 1
          fi

          printf '%s\n' "${CRONET_SO}" > /tmp/cronet_so_path

          echo '=== file ==='
          file "${CRONET_SO}"

          echo '=== ELF header ==='
          readelf -h "${CRONET_SO}"

          echo '=== Dynamic section ==='
          readelf -d "${CRONET_SO}" | sed -n '1,260p'

          echo '=== Architecture check ==='
          file "${CRONET_SO}" | grep -Eiq 'ELF 64-bit.*x86-64.*shared object'

      - name: Collect minimal release artifact
        working-directory: /home/runner/chromium/src
        run: |
          set -euxo pipefail

          CRONET_SO="$(cat /tmp/cronet_so_path)"
          REVISION="$(git rev-parse HEAD)"
          VERSION="$(awk -F= '$1=="MAJOR"{m=$2} $1=="MINOR"{n=$2} $1=="BUILD"{b=$2} $1=="PATCH"{p=$2} END{print m "." n "." b "." p}' chrome/VERSION)"

          rm -rf /tmp/cronet-artifact
          mkdir -p /tmp/cronet-artifact

          # Stable downstream filename + the exact Chromium-generated filename.
          cp -L "${CRONET_SO}" /tmp/cronet-artifact/libcronet.so
          cp -L "${CRONET_SO}" "/tmp/cronet-artifact/$(basename "${CRONET_SO}")"

          printf '%s\n' "${REVISION}" > /tmp/cronet-artifact/chromium_revision.txt
          printf '%s\n' "${VERSION}" > /tmp/cronet-artifact/chromium_version.txt

          cat > /tmp/cronet-artifact/build_info.txt <<INFO
          Chromium revision: ${REVISION}
          Chromium version: ${VERSION}
          GN output: ${OUT_DIR}
          Target: //components/cronet:cronet
          Platform: Linux x86-64 / amd64
          Build: release / non-component / official
          Artifact: libcronet.so
          INFO

          echo '=== Final artifact ==='
          ls -lh /tmp/cronet-artifact
          file /tmp/cronet-artifact/*.so

      - name: Upload libcronet.so
        uses: actions/upload-artifact@v4
        with:
          name: cronet-linux-x64
          path: /tmp/cronet-artifact/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Final resource report
        if: always()
        run: |
          echo '=== Disk ==='
          df -hT
          echo '=== RAM ==='
          free -h
          echo '=== Load ==='
          uptime || true
