name: Build Latest Chromium Cronet Windows x64

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64 Cronet
    runs-on: windows-2022
    timeout-minutes: 360

    env:
      DEPOT_TOOLS: 'C:\depot_tools'
      CHROMIUM_ROOT: 'C:\chromium'
      CHROMIUM_SRC: 'C:\chromium\src'
      OUT_DIR: 'C:\chromium\src\out\Cronet'
      DEPOT_TOOLS_WIN_TOOLCHAIN: '0'
      GYP_MSVS_VERSION: '2022'
      GIT_TERMINAL_PROMPT: '0'

    steps:
      - name: Install depot_tools
        shell: pwsh
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git C:\depot_tools
          Add-Content $env:GITHUB_PATH C:\depot_tools

      - name: Checkout Chromium
        shell: cmd
        run: |
          set PATH=C:\depot_tools;%PATH%
          if not exist C:\chromium mkdir C:\chromium
          cd /d C:\chromium
          call fetch.bat --nohooks --no-history chromium

      - name: Run hooks
        shell: cmd
        run: |
          set PATH=C:\depot_tools;%PATH%
          cd /d C:\chromium\src
          call gclient.bat runhooks

      - name: Generate args.gn
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:OUT_DIR" | Out-Null
          @(
            'target_cpu = "x64"',
            'host_cpu = "x64"',
            'is_debug = false',
            'is_component_build = false',
            'symbol_level = 0',
            'blink_symbol_level = 0',
            'v8_symbol_level = 0',
            'use_thin_lto = false',
            'chrome_pgo_phase = 0'
          ) | Out-File "$env:OUT_DIR\args.gn" -Encoding utf8

      - name: GN generate
        shell: cmd
        run: |
          set PATH=C:\depot_tools;%PATH%
          set INCLUDE=
          set LIB=
          set LIBPATH=
          set WindowsSDKVersion=

          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64

          cd /d C:\chromium\src
          call gn.bat gen "%OUT_DIR%"

      - name: Build Cronet
        shell: cmd
        run: |
          set PATH=C:\depot_tools;%PATH%
          cd /d C:\chromium\src
          call autoninja.bat -C "%OUT_DIR%" //components/cronet:cronet

      - name: Package artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\cronet-artifact\bin | Out-Null
          Copy-Item "$env:OUT_DIR\cronet.dll" C:\cronet-artifact\bin\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cronet-windows-x64-latest
          path: C:\cronet-artifact
          retention-days: 7
