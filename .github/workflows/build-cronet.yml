name: Build Latest Chromium Cronet Windows x64

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64 Cronet
    runs-on: windows-2022
    timeout-minutes: 360

    env:
      DEPOT_TOOLS: 'C:\depot_tools'
      CHROMIUM_ROOT: 'C:\chromium'
      CHROMIUM_SRC: 'C:\chromium\src'
      OUT_DIR: 'C:\chromium\src\out\Cronet'
      DEPOT_TOOLS_WIN_TOOLCHAIN: '0'
      GYP_MSVS_VERSION: '2022'
      GIT_TERMINAL_PROMPT: '0'

    steps:

      - name: Show runner information
        shell: pwsh
        run: |
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion
          Get-PSDrive C

      - name: Free disk space
        shell: pwsh
        run: |
          $paths = @(
            "C:\Android",
            "C:\Program Files\Android",
            "C:\hostedtoolcache\windows\CodeQL",
            "C:\Program Files\dotnet"
          )

          foreach ($p in $paths) {
            if (Test-Path $p) {
              Remove-Item $p -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Install depot_tools
        shell: pwsh
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git C:\depot_tools
          Add-Content $env:GITHUB_PATH C:\depot_tools

      - name: Detect Visual Studio and Windows SDK
        shell: pwsh
        run: |

          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (-not $vs) {
            throw "Visual Studio 2022 not found"
          }

          $sdkRoot = "C:\Program Files (x86)\Windows Kits\10"

          $sdkInclude = Join-Path $sdkRoot "Include"

          if (!(Test-Path $sdkInclude)) {
            throw "Windows SDK Include directory missing"
          }

          $sdk = Get-ChildItem $sdkInclude -Directory |
            Where-Object { $_.Name -match "^10\." } |
            Sort-Object Name -Descending |
            Select-Object -First 1

          if (-not $sdk) {
            throw "No Windows SDK version found"
          }

          $version = $sdk.Name

          if (!(Test-Path "$sdkInclude\$version\um")) {
            throw "SDK um folder missing: $version"
          }

          if (!(Test-Path "$sdkInclude\$version\shared")) {
            throw "SDK shared folder missing: $version"
          }

          Write-Host "VS=$vs"
          Write-Host "SDK=$version"

          "VS_PATH=$vs" >> $env:GITHUB_ENV
          "WINDOWS_SDK_VERSION=$version" >> $env:GITHUB_ENV
          "WindowsSdkDir=$sdkRoot\" >> $env:GITHUB_ENV
          "WindowsSDKVersion=$version\" >> $env:GITHUB_ENV

      - name: Checkout Chromium
        shell: cmd
        run: |
          set PATH=C:\depot_tools;%PATH%

          if not exist C:\chromium mkdir C:\chromium

          cd /d C:\chromium

          call fetch.bat --nohooks --no-history chromium

      - name: Run Chromium hooks
        shell: cmd
        run: |
          set PATH=C:\depot_tools;%PATH%

          cd /d C:\chromium\src

          call gclient.bat runhooks

      - name: Generate args.gn
        shell: pwsh
        run: |

          New-Item -ItemType Directory -Force "$env:OUT_DIR" | Out-Null

          @(
            'target_cpu = "x64"',
            'host_cpu = "x64"',
            'is_debug = false',
            'is_component_build = false',
            'is_official_build = false',
            'symbol_level = 0',
            'blink_symbol_level = 0',
            'v8_symbol_level = 0',
            'use_thin_lto = false',
            'chrome_pgo_phase = 0',
            'enable_nacl = false'
          ) | Out-File "$env:OUT_DIR\args.gn" -Encoding utf8

      - name: GN generate with detected SDK
        shell: cmd
        run: |

          set PATH=C:\depot_tools;%PATH%

          set INCLUDE=
          set LIB=
          set LIBPATH=

          call "%VS_PATH%\Common7\Tools\VsDevCmd.bat" -arch=x64

          set WindowsSdkDir=C:\Program Files (x86)\Windows Kits\10\
          set WindowsSDKVersion=%WINDOWS_SDK_VERSION%\

          echo ==== SDK ====
          echo %WindowsSDKVersion%

          echo ==== INCLUDE ====
          echo %INCLUDE%

          cd /d C:\chromium\src

          call gn.bat gen "%OUT_DIR%"

      - name: Build Cronet
        shell: cmd
        run: |

          set PATH=C:\depot_tools;%PATH%

          cd /d C:\chromium\src

          call autoninja.bat -C "%OUT_DIR%" //components/cronet:cronet

      - name: Package Cronet
        shell: pwsh
        run: |

          $out = "C:\cronet-artifact"

          New-Item -ItemType Directory -Force "$out\bin" | Out-Null

          if (!(Test-Path "$env:OUT_DIR\cronet.dll")) {
            throw "cronet.dll not found"
          }

          Copy-Item "$env:OUT_DIR\cronet.dll" "$out\bin\"

          Copy-Item "$env:CHROMIUM_SRC\components\cronet\native\include\*.h" "$out" -ErrorAction SilentlyContinue

      - name: Upload Cronet artifact
        uses: actions/upload-artifact@v4
        with:
          name: cronet-windows-x64-latest
          path: C:\cronet-artifact
          compression-level: 0
          retention-days: 7
